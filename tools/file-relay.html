<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>VEM file relay</title><meta name="robots" content="noindex"></head>
<body>
<script>
// Passes a file from a GitHub raw URL to a VEM Studio Gumroad editor page.
const ALLOWED_PARENT = "https://gumroad.com";
window.addEventListener("message", async (e) => {
  if (e.origin !== ALLOWED_PARENT) return;
  const { url, name, id } = e.data || {};
  if (typeof url !== "string" || !url.startsWith("https://raw.githubusercontent.com/maro-manmar/")) return;
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const buf = await r.arrayBuffer();
    e.source.postMessage({ id, name, buf }, ALLOWED_PARENT, [buf]);
  } catch (err) {
    e.source.postMessage({ id, name, error: String(err) }, ALLOWED_PARENT);
  }
});
parent.postMessage({ ready: true }, ALLOWED_PARENT);
</script>
</body></html>
