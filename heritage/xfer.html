<!DOCTYPE html><meta charset="utf-8"><meta name="robots" content="noindex"><title>.</title>
<script>
(async function(){
 var q=new URLSearchParams(location.search).getAll('img');var out=[];
 for(var i=0;i<q.length;i++){
  var im=new Image(); im.src='img/'+q[i]; await im.decode();
  var c=document.createElement('canvas'); c.width=im.naturalWidth; c.height=im.naturalHeight; c.getContext('2d').drawImage(im,0,0);
  out.push({name:q[i].replace('.webp','.jpg'),data:c.toDataURL('image/jpeg',0.9)});
 }
 var t=window.opener||(window.parent!==window?window.parent:null);
 if(t){t.postMessage({vemxfer:out},'https://gumroad.com');}
 document.title='sent '+out.length;
})();
</script>
