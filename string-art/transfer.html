<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Transfer</title></head><body>
<p id="s">Preparing files…</p>
<script>
(async function(){
  var allowed = "https://gumroad.com";
  var target = window.opener || (window.parent !== window ? window.parent : null);
  if (!target) { document.getElementById("s").textContent = "Nothing to do."; return; }
  var want = (location.hash.slice(1) || "").split(",").filter(Boolean);
  var out = [];
  for (var i=0;i<want.length;i++){
    var n = want[i];
    if (n === "full"){
      var t = await (await fetch("./index.html",{cache:"no-store"})).text();
      t = t.replace("var FULL = false; /*@FULL@*/","var FULL = true;");
      t = t.replace(/<link rel="canonical"[^>]*>\n?/, "");
      out.push({name:"nail-and-thread-full.html", type:"text/html", buf: new TextEncoder().encode(t).buffer});
    } else if (n === "lmfull"){
      var u = await (await fetch("../ai-label/index.html",{cache:"no-store"})).text();
      u = u.replace("var FULL = false; /*@FULL@*/","var FULL = true; /*@FULL@*/").replace(/<!--@LANDING-->[\s\S]*?<!--@\/LANDING-->/g,"");
      u = u.replace(/<link rel="canonical"[^>]*>\n?/, "").replace(/<meta property="og:[^>]*>\n?/g, "");
      u = u.replace("<title>LabelMark — Label AI images for the EU AI Act (Article 50)</title>","<title>LabelMark — Full version</title>");
      out.push({name:"labelmark-full.html", type:"text/html", buf: new TextEncoder().encode(u).buffer});
    } else if (/^[a-z0-9-]+\.(jpg|png)$/.test(n)){
      var b = await (await fetch("./"+n,{cache:"no-store"})).arrayBuffer();
      out.push({name:n, type: n.endsWith(".png")?"image/png":"image/jpeg", buf:b});
    }
  }
  target.postMessage({vemTransfer: out}, allowed, out.map(function(o){return o.buf;}));
  document.getElementById("s").textContent = "Done.";
  if (window.opener) setTimeout(function(){ window.close(); }, 800);
})();
</script></body></html>
