<style>
:root{
  --paper:#F5F0E6; --card:#FFFDF8; --ink:#1D1B18; --muted:#5E574D; --line:#DDD3C3;
  --accent:#9B2D20; --accent-ink:#FFFFFF; --soft:#EDE5D6;
  --serif:"Fraunces", Georgia, "Times New Roman", serif;
  --sans:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans)}
a{color:var(--accent)}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:.01em;text-decoration:none;color:var(--ink)}
.brand svg{width:30px;height:30px}
.brand small{font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:block;margin-top:-2px}
.langs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:999px}
.langs button{border:0;background:transparent;font:600 12px var(--sans);letter-spacing:.06em;padding:7px 11px;border-radius:999px;color:var(--muted);cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;padding:36px 0 56px}
.eyebrow{font:600 12px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0 0 14px}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(36px,5.4vw,60px);line-height:1.04;letter-spacing:-.015em;margin:0 0 18px}
h1 em{font-style:italic;color:var(--accent)}
.lead{font-size:18px;color:var(--muted);max-width:34em;margin:0 0 26px}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--ink);background:transparent;color:var(--ink);font:600 15px var(--sans);padding:13px 20px;border-radius:999px;cursor:pointer;text-decoration:none;min-height:46px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:9px 14px;font-size:13px;min-height:38px}
.note{font-size:13px;color:var(--muted)}
.hero-art{aspect-ratio:1;border-radius:50%;background:var(--card);box-shadow:0 30px 60px -30px rgba(60,40,20,.35),inset 0 0 0 1px var(--line);display:grid;place-items:center;overflow:hidden}
.hero-art canvas{width:100%;height:100%}
section{padding:56px 0}
section.alt{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
h2{font-family:var(--serif);font-weight:400;font-size:clamp(28px,3.6vw,40px);line-height:1.1;letter-spacing:-.01em;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 30px;max-width:40em}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;counter-reset:s}
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px}
section.alt .step{background:var(--paper)}
.step b{display:block;font-family:var(--serif);font-size:20px;font-weight:600;margin:6px 0}
.step .n{font:600 12px var(--sans);letter-spacing:.14em;color:var(--accent)}
.step p{margin:0;color:var(--muted);font-size:15px}
/* studio */
.studio{display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.panel h3{font:600 13px var(--sans);letter-spacing:.12em;text-transform:uppercase;margin:0 0 14px;color:var(--muted)}
.drop{display:block;border:1.5px dashed #BFB3A0;border-radius:12px;padding:18px;text-align:center;cursor:pointer;background:var(--paper)}
.drop strong{display:block;font-size:15px}
.drop span{font-size:13px;color:var(--muted)}
.crop{margin-top:14px;display:none}
.crop canvas{width:100%;aspect-ratio:1;border-radius:50%;background:#fff;touch-action:none;cursor:grab;box-shadow:inset 0 0 0 1px var(--line)}
.field{margin:14px 0}
.field label{display:flex;justify-content:space-between;font-size:14px;font-weight:500;margin-bottom:6px}
.field label output{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:400}
input[type=range]{width:100%;accent-color:var(--accent)}
.field select,.field input[type=number]{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;font:15px var(--sans);color:var(--ink)}
.stage{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.board{position:relative;aspect-ratio:1;max-width:620px;margin:0 auto;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.board canvas{width:100%;height:100%;display:block}
.board .empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:20%;font-size:15px}
.bar{height:6px;background:var(--soft);border-radius:999px;overflow:hidden;margin:16px auto 0;max-width:620px;visibility:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:620px;margin:16px auto 0}
.stat{background:var(--paper);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font:600 20px var(--sans);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{font-size:12px;color:var(--muted)}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:620px;margin:16px auto 0}
.tools .btn{width:100%;font-size:14px;padding:10px 12px}
.lock{font-size:12px;opacity:.8}
.seq{max-width:620px;margin:18px auto 0;font:14px/1.9 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;color:var(--ink);background:var(--paper);border-radius:12px;padding:14px;max-height:180px;overflow:auto;word-spacing:4px}
.seq .more{display:block;margin-top:8px;font-family:var(--sans);color:var(--accent);font-weight:600}
/* pricing */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:820px}
.plan{border:1px solid var(--line);border-radius:var(--r);padding:26px;background:var(--paper)}
.plan.ours{background:var(--ink);color:#fff;border-color:var(--ink)}
.plan .price{font-family:var(--serif);font-size:46px;line-height:1;margin:10px 0 4px}
.plan .per{font-size:14px;opacity:.75}
.plan ul{padding:0;margin:18px 0 22px;list-style:none}
.plan li{padding:7px 0 7px 26px;position:relative;font-size:15px;border-top:1px solid rgba(127,127,127,.18)}
.plan li:before{content:"";position:absolute;left:2px;top:14px;width:12px;height:6px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg)}
.plan.ours li:before{color:#E7B9A9}
.plan.them li:before{border:0;width:12px;height:2px;background:currentColor;transform:none;top:18px;opacity:.5}
.faq{max-width:760px}
.faq details{border-top:1px solid var(--line);padding:16px 0}
.faq details:last-child{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;font-weight:600;font-size:17px;list-style:none;display:flex;justify-content:space-between;gap:16px}
.faq summary:after{content:"+";font-family:var(--serif);font-size:24px;line-height:1;color:var(--accent)}
.faq details[open] summary:after{content:"–"}
.faq p{color:var(--muted);margin:10px 0 0}
footer{padding:36px 0 50px;color:var(--muted);font-size:13px}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
/* player */
.player{position:fixed;inset:0;background:var(--ink);color:#fff;display:none;flex-direction:column;z-index:50}
.player.on{display:flex}
.player .ptop{display:flex;justify-content:space-between;align-items:center;padding:16px 20px}
.player .pmain{flex:1;display:grid;place-items:center;text-align:center;padding:10px}
.player .count{font:500 15px var(--sans);opacity:.7;font-variant-numeric:tabular-nums}
.player .pair{display:flex;align-items:center;gap:22px;justify-content:center;margin:16px 0}
.player .from{font:400 clamp(40px,10vw,84px) var(--serif);opacity:.45;font-variant-numeric:tabular-nums}
.player .to{font:600 clamp(96px,26vw,220px)/1 var(--serif);font-variant-numeric:tabular-nums}
.player .arrow{font-size:40px;opacity:.5}
.player .pbar{height:4px;background:rgba(255,255,255,.15);margin:0 20px}
.player .pbar i{display:block;height:100%;background:#E7B9A9;width:0}
.player .pctl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:20px}
.player .btn{border-color:rgba(255,255,255,.4);color:#fff}
.player .btn.primary{background:#fff;color:var(--ink);border-color:#fff}
.player .opts{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:14px;opacity:.85;padding:0 20px 18px}
.player .opts label{display:flex;gap:6px;align-items:center}
.player .opts input[type=number]{width:64px;padding:6px;border-radius:8px;border:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-size:14px;display:none;z-index:60}
.full-only{display:none}
body.full .full-only{display:revert}
body.full .demo-only{display:none!important}
@media (max-width:860px){
  .hero{grid-template-columns:1fr;gap:28px;padding-top:12px}
  .hero-art{max-width:420px;width:100%;margin:0 auto}
  .steps{grid-template-columns:1fr}
  .studio{grid-template-columns:1fr}
  .compare{grid-template-columns:1fr}
  .stat b{font-size:17px}
  .stat{padding:10px 6px}
}
@media print{body *{visibility:hidden}}
</style>

<script id="worker-src" type="text/plain">
self.onmessage = function(e){
  var d = e.data, S = d.S, N = d.N, L = d.L, w = d.weight, minDist = d.minDist;
  var res = new Float32Array(d.pix);
  var nx = new Float32Array(N), ny = new Float32Array(N);
  var c = (S-1)/2, r = (S-1)/2;
  for (var i=0;i<N;i++){ var a = 2*Math.PI*i/N - Math.PI/2; nx[i]=c+r*Math.cos(a); ny[i]=c+r*Math.sin(a); }
  // precompute line pixel lists lazily into cache keyed by pair
  var cache = new Map();
  function line(a,b){
    var key = a<b ? a*N+b : b*N+a;
    var v = cache.get(key);
    if (v) return v;
    var x0=nx[a], y0=ny[a], x1=nx[b], y1=ny[b];
    var n = Math.max(Math.abs(x1-x0), Math.abs(y1-y0))|0;
    if (n<1) n=1;
    var arr = new Int32Array(n+1);
    for (var k=0;k<=n;k++){ var t=k/n; arr[k] = (Math.round(y0+(y1-y0)*t))*S + Math.round(x0+(x1-x0)*t); }
    if (cache.size < 60000) cache.set(key, arr);
    return arr;
  }
  var cur = 0, seq = [0], prev1 = -1, prev2 = -1, lastSent = 1;
  for (var step=0; step<L; step++){
    var best=-1, bestScore=-1e9;
    for (var j=0;j<N;j++){
      var dd = Math.abs(j-cur); if (dd > N-dd) dd = N-dd;
      if (dd < minDist || j===prev1 || j===prev2) continue;
      var p = line(cur,j), s=0;
      for (var k=0;k<p.length;k++) s += res[p[k]];
      s /= p.length;
      if (s > bestScore){ bestScore=s; best=j; }
    }
    if (best<0 || bestScore <= 0.003) break; // image is complete — stop instead of adding noise
    var p2 = line(cur,best);
    for (var k2=0;k2<p2.length;k2++) res[p2[k2]] -= w;
    prev2 = prev1; prev1 = cur; cur = best; seq.push(best);
    if (step % 60 === 0){ self.postMessage({type:'progress', done:step, total:L, add:seq.slice(lastSent-1)}); lastSent = seq.length; }
  }
  self.postMessage({type:'done', seq:seq});
};

function cropSource(){ // returns {sx,sy,sw}
  var im=state.img, side=Math.min(im.naturalWidth||im.width, im.naturalHeight||im.height)/state.zoom;
  var W=im.naturalWidth||im.width, H=im.naturalHeight||im.height;
  var sx=(W-side)/2 + state.ox*(W-side)/2, sy=(H-side)/2 + state.oy*(H-side)/2;
  sx=Math.max(0,Math.min(W-side,sx)); sy=Math.max(0,Math.min(H-side,sy));
  return {sx:sx, sy:sy, sw:side};
}
function processed(size){
  var c=document.createElement("canvas"); c.width=c.height=size; var g=c.getContext("2d");
  var s=cropSource(); g.fillStyle="#fff"; g.fillRect(0,0,size,size);
  g.drawImage(state.img, s.sx, s.sy, s.sw, s.sw, 0, 0, size, size);
  var id=g.getImageData(0,0,size,size), d=id.data, k=+$("contrast").value, b=+$("bright").value;
  var cx=(size-1)/2, r2=(size/2)*(size/2);
  for (var y=0;y<size;y++) for (var x=0;x<size;x++){
    var i=(y*size+x)*4, v=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
    v=(v-128)*k+128+b; v=v<0?0:v>255?255:v;
    if ((x-cx)*(x-cx)+(y-cx)*(y-cx)>r2) v=255;
    d[i]=d[i+1]=d[i+2]=v; d[i+3]=255;
  }
  g.putImageData(id,0,0); return {canvas:c, data:d};
}
function drawCrop(){
  if (!state.img) return;
  var cv=$("crop"), g=cv.getContext("2d"), p=processed(cv.width);
  g.clearRect(0,0,cv.width,cv.height); g.save(); g.beginPath(); g.arc(cv.width/2,cv.height/2,cv.width/2,0,Math.PI*2); g.clip();
  g.drawImage(p.canvas,0,0); g.restore();
}
(function(){
  var cv=$("crop"), drag=null;
  cv.addEventListener("pointerdown", function(e){ if(!state.img) return; drag={x:e.clientX,y:e.clientY,ox:state.ox,oy:state.oy}; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointermove", function(e){
    if(!drag) return; var w=cv.getBoundingClientRect().width; if (state.zoom<=1.001) return;
    state.ox=Math.max(-1,Math.min(1, drag.ox-(e.clientX-drag.x)/w*2/(state.zoom-1)));
    state.oy=Math.max(-1,Math.min(1, drag.oy-(e.clientY-drag.y)/w*2/(state.zoom-1)));
    drawCrop();
  });
  ["pointerup","pointercancel"].forEach(function(ev){ cv.addEventListener(ev, function(){ drag=null; }); });
})();

/* ---------------- generation ---------------- */
var workerURL = URL.createObjectURL(new Blob([$("worker-src").textContent], {type:"text/javascript"}));
function nailPos(i,N,size){ var a=2*Math.PI*i/N-Math.PI/2, c=(size-1)/2, r=(size-1)/2; return [c+r*Math.cos(a), c+r*Math.sin(a)]; }
function boardCtx(){ return $("board").getContext("2d"); }
function clearBoard(N){
  var cv=$("board"), g=cv.getContext("2d"), W=cv.width;
  g.fillStyle="#fff"; g.fillRect(0,0,W,W);
  g.fillStyle="#8c8170";
  for (var i=0;i<N;i++){ var p=nailPos(i,N,W-20); g.beginPath(); g.arc(p[0]+10,p[1]+10,1.6,0,Math.PI*2); g.fill(); }
}
function lineAlpha(){ var w=+$("weight").value; return Math.min(0.7, w*1.8); }
function lineW(W){ return Math.max(1, W/S*0.85); }
function drawLines(seq, from, N, L){
  var cv=$("board"), g=cv.getContext("2d"), W=cv.width-20;
  g.strokeStyle="rgba(20,18,16,"+lineAlpha()+")"; g.lineWidth=lineW(W);
  for (var i=Math.max(1,from);i<seq.length;i++){ var a=nailPos(seq[i-1],N,W), b=nailPos(seq[i],N,W); g.beginPath(); g.moveTo(a[0]+10,a[1]+10); g.lineTo(b[0]+10,b[1]+10); g.stroke(); }
}
$("genBtn").addEventListener("click", function(){
  if (busy || !state.img) return;
  busy=true; var btn=$("genBtn"); btn.disabled=true; btn.textContent=t("generating");
  $("empty").style.display="none"; $("bar").style.visibility="visible"; $("bar").firstElementChild.style.width="0";
  var N=+$("nails").value, L=+$("lines").value; state.N=N; state.L=L; state.diam=+$("diam").value; state.seq=null;
  clearBoard(N); setTools(false); $("seq").hidden=true;
  var p=processed(S), d=p.data, pix=new Float32Array(S*S);
  for (var i=0;i<S*S;i++) pix[i]=(255-d[i*4])/255;
  if (worker) worker.terminate();
  worker=new Worker(workerURL); var drawn=[0];
  worker.onmessage=function(e){
    var m=e.data;
    if (m.type==="progress"){
      var prevLen=drawn.length; drawn=drawn.concat(m.add.slice(1));
      drawLines(drawn, prevLen, N, L);
      $("bar").firstElementChild.style.width=(100*m.done/m.total)+"%";
    } else if (m.type==="done"){
      finish(m.seq);
    }
  };
  worker.postMessage({pix:pix.buffer, S:S, N:N, L:L, weight:+$("weight").value, minDist:Math.max(8,Math.round(N/18))}, [pix.buffer]);
});
function finish(seq){
  state.seq=seq; busy=false; var btn=$("genBtn"); btn.disabled=false; btn.textContent=t("generate");
  clearBoard(state.N); drawLines(seq,1,state.N,state.L);
  $("bar").firstElementChild.style.width="100%"; setTimeout(function(){ $("bar").style.visibility="hidden"; }, 600);
  updateStats(); renderSeq(); setTools(true);
  try{ localStorage.removeItem("nt_pos_"+seqKey()); }catch(e){}
}
function threadMeters(){
  var s=state.seq, N=state.N, sum=0;
  for (var i=1;i<s.length;i++){ var d=Math.abs(s[i]-s[i-1]); sum+=2*Math.sin(Math.PI*d/N); }
  return sum*(state.diam/2)/100*1.1; // +10% for knots and wrapping around nails
}
function updateStats(){
  if (!state.seq) return;
  $("stN").textContent=fmt(state.N); $("stL").textContent=fmt(state.seq.length-1);
  $("stT").textContent=fmt(Math.round(threadMeters()))+" m";
}
function renderSeq(){
  var el=$("seq"), s=state.seq; if(!s) return; el.hidden=false;
  var show = FULL ? s : s.slice(0, DEMO_STEPS+1);
  el.textContent = show.join(" → ");
  if (!FULL){ var a=document.createElement("a"); a.className="more"; a.href=BUY_URL; a.textContent=t("more",{n:fmt(s.length-1-DEMO_STEPS)}); el.appendChild(a); }
}
function setTools(on){ document.querySelectorAll("#tools .btn").forEach(function(b){ b.disabled=!on; }); }

/* ---------------- downloads & printing ---------------- */
function download(name, blob){
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function stamp(){ var d=new Date(); return d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0"); }
function printHTML(title, body, css){
  var html="<!DOCTYPE html><html><head><meta charset='utf-8'><title>"+title+"</title><style>"+css+"</style></head><body>"+body+"<script>window.onload=function(){setTimeout(function(){window.print()},300)}<\/script></body></html>";
  var w=window.open(URL.createObjectURL(new Blob([html],{type:"text/html"})), "_blank");
  if (!w) download(title.replace(/\s+/g,"-")+".html", new Blob([html],{type:"text/html"}));
}
function templateSVGContent(Dmm, N){
  var R=Dmm/2, out="", fs=Math.max(1.8, Math.min(3.2, Math.PI*Dmm/N*0.55));
  out+="<circle cx='0' cy='0' r='"+R+"' fill='none' stroke='#999' stroke-width='0.25' stroke-dasharray='2 2'/>";
  out+="<path d='M-6 0H6M0 -6V6' stroke='#000' stroke-width='0.3'/>";
  for (var i=0;i<N;i++){
    var a=2*Math.PI*i/N-Math.PI/2, x=R*Math.cos(a), y=R*Math.sin(a), lx=(R+4.2)*Math.cos(a), ly=(R+4.2)*Math.sin(a);
    var big = i%10===0;
    out+="<circle cx='"+x.toFixed(2)+"' cy='"+y.toFixed(2)+"' r='"+(big?0.75:0.55)+"' fill='#000'/>";
    var rot=(a*180/Math.PI+90); if (rot>90 && rot<270) rot+=180;
    out+="<text x='"+lx.toFixed(2)+"' y='"+ly.toFixed(2)+"' font-size='"+fs.toFixed(2)+"' font-weight='"+(big?700:400)+"' text-anchor='middle' dominant-baseline='central' transform='rotate("+rot.toFixed(1)+" "+lx.toFixed(2)+" "+ly.toFixed(2)+")'>"+i+"</text>";
  }
  return out;
}
function printTemplate(){
  var Dmm=state.diam*10, N=state.N, margin=12, full=Dmm+2*margin;
  var pw=190, ph=270; // printable area on A4 (also fits US Letter)
  var cols=Math.ceil(full/pw), rows=Math.ceil(full/ph), total=cols*rows;
  var ox=-(cols*pw)/2, oy=-(rows*ph)/2, inner=templateSVGContent(Dmm,N), body="", n=0;
  var ruler="<g transform='translate("+(-50)+","+(R0())+")'><rect x='0' y='0' width='100' height='3' fill='none' stroke='#000' stroke-width='0.3'/>";
  for (var k=0;k<=10;k++) ruler+="<path d='M"+(k*10)+" 0V"+(k%5===0?5:4)+"' stroke='#000' stroke-width='0.3'/>";
  ruler+="<text x='50' y='9' font-size='3' text-anchor='middle'>10 cm</text></g>";
  function R0(){ return -Dmm/2+Math.min(40, Dmm*0.28); }
  for (var r=0;r<rows;r++) for (var c=0;c<cols;c++){
    n++; var vx=ox+c*pw, vy=oy+r*ph, marks="";
    [[vx,vy],[vx+pw,vy],[vx,vy+ph],[vx+pw,vy+ph]].forEach(function(p){ marks+="<path d='M"+(p[0]-4)+" "+p[1]+"H"+(p[0]+4)+"M"+p[0]+" "+(p[1]-4)+"V"+(p[1]+4)+"' stroke='#c00' stroke-width='0.3'/>"; });
    body+="<div class='pg'><div class='hd'><b>"+t("tplTitle")+"</b> — "+t("tplPage",{a:n,b:total,r:r+1,c:c+1})+"<br>"+t("tplInfo",{d:state.diam,n:N})+(n===1?"<br>"+t("tplAssemble"):"")+"</div>"+
      "<svg xmlns='http://www.w3.org/2000/svg' width='"+pw+"mm' height='"+ph+"mm' viewBox='"+vx+" "+vy+" "+pw+" "+ph+"' font-family='Arial,Helvetica,sans-serif'>"+inner+ruler+marks+"</svg></div>";
  }
  printHTML(t("tplTitle"), body, "@page{size:A4;margin:10mm 10mm 12mm}body{margin:0;font:9pt Arial,sans-serif}.pg{page-break-after:always;width:190mm;position:relative}.pg:last-child{page-break-after:auto}.hd{position:absolute;top:0;left:0;max-width:150mm;background:#fff;padding:0 2mm 1mm 0;z-index:2;color:#444;line-height:1.35}svg{display:block}");
}
function printChecklist(){
  var s=state.seq, ROWS=45, per=ROWS*4, pages=Math.ceil((s.length-1)/per), body="";
  for (var p=0;p<pages;p++){
    var rows="";
    for (var col=0;col<4;col++){
      rows+="<div class='col'>";
      for (var k=0;k<ROWS;k++){ var i=p*per+col*ROWS+k+1; if (i>=s.length) break; rows+="<div class='r'><span class='b'></span><span class='i'>"+i+"</span><span class='v'>"+s[i-1]+" → <b>"+s[i]+"</b></span></div>"; }
      rows+="</div>";
    }
    body+="<div class='pg'><div class='hd'><b>"+t("chkTitle")+"</b> · "+t("chkInfo",{n:state.N,l:fmt(s.length-1)})+" · "+(p+1)+"/"+pages+"</div><div class='cols'>"+rows+"</div></div>";
  }
  printHTML(t("chkTitle"), body, "@page{size:A4;margin:12mm}body{margin:0;font:9.5pt Arial,sans-serif;color:#111}.pg{page-break-after:always}.pg:last-child{page-break-after:auto}.hd{margin-bottom:4mm;color:#444}.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:0 6mm}.r{display:flex;align-items:center;gap:2mm;height:5.1mm;border-bottom:0.2mm solid #ddd;font-variant-numeric:tabular-nums}.b{width:3mm;height:3mm;border:0.25mm solid #555;border-radius:0.6mm;flex:none}.i{width:9mm;color:#888;text-align:right;flex:none}.v b{font-size:10.5pt}");
}
function txtExport(){
  var s=state.seq, lines=["Nail & Thread — VEM Studio","Nails: "+state.N+" | Lines: "+(s.length-1)+" | Diameter: "+state.diam+" cm | Thread ≈ "+Math.round(threadMeters())+" m","Nail 0 = top, numbers go clockwise.",""];
  for (var i=1;i<s.length;i++) lines.push(i+"\t"+s[i-1]+" -> "+s[i]);
  download("string-art-sequence-"+stamp()+".txt", new Blob([lines.join("\r\n")],{type:"text/plain"}));
}
function pngExport(){
  var c=document.createElement("canvas"); c.width=c.height=1600; var g=c.getContext("2d");
  g.fillStyle="#fff"; g.fillRect(0,0,1600,1600); var W=1560;
  g.strokeStyle="rgba(20,18,16,"+lineAlpha()+")"; g.lineWidth=lineW(W); var s=state.seq;
  for (var i=1;i<s.length;i++){ var a=nailPos(s[i-1],state.N,W), b=nailPos(s[i],state.N,W); g.beginPath(); g.moveTo(a[0]+20,a[1]+20); g.lineTo(b[0]+20,b[1]+20); g.stroke(); }
  if (!FULL){ g.fillStyle="rgba(155,45,32,.85)"; g.font="600 34px Arial"; g.textAlign="center"; g.fillText("Preview · Nail & Thread by VEM Studio", 800, 1560); }
  c.toBlob(function(b){ download("string-art-preview-"+stamp()+".png", b); });
}
function saveProject(){
  var data={app:"nail-and-thread",v:1,N:state.N,L:state.L,diam:state.diam,seq:state.seq};
  download("string-art-project-"+stamp()+".json", new Blob([JSON.stringify(data)],{type:"application/json"})); toast(t("saved"));
}
$("loadFile").addEventListener("change", function(e){
  var f=e.target.files[0]; if(!f) return; var rd=new FileReader();
  rd.onload=function(){ try{ var d=JSON.parse(rd.result); if(d.app!=="nail-and-thread"||!Array.isArray(d.seq)) throw 0;
    state.N=d.N; state.L=d.L; state.diam=d.diam; state.seq=d.seq; $("empty").style.display="none";
    clearBoard(d.N); drawLines(d.seq,1,d.N,d.L); updateStats(); renderSeq(); setTools(true); toast(t("loaded"));
  }catch(err){ toast(t("badPhoto")); } };
  rd.readAsText(f);
});
document.querySelectorAll("#tools .btn").forEach(function(b){
  b.addEventListener("click", function(){
    var act=b.dataset.act; if (!state.seq) return;
    if (!FULL && act!=="png"){ toast(t("lockMsg")); setTimeout(function(){ location.hash="price"; var el=$("price"); if (el) el.scrollIntoView({behavior:"smooth"}); }, 500); return; }
    ({player:openPlayer, template:printTemplate, checklist:printChecklist, txt:txtExport, png:pngExport, save:saveProject})[act]();
  });
});

/* ---------------- step player ---------------- */
var pos=1, timer=null;
function seqKey(){ var s=state.seq||[]; var h=0; for (var i=0;i<s.length;i+=7) h=(h*31+s[i])|0; return state.N+"_"+s.length+"_"+h; }
function openPlayer(){
  try{ pos=+localStorage.getItem("nt_pos_"+seqKey())||1; }catch(e){ pos=1; }
  $("player").classList.add("on"); showStep(); document.addEventListener("keydown", keys);
}
function closePlayer(){ stopPlay(); $("player").classList.remove("on"); document.removeEventListener("keydown", keys); }
function showStep(){
  var s=state.seq, n=s.length-1; pos=Math.max(1,Math.min(n,pos));
  $("pFrom").textContent=s[pos-1]; $("pTo").textContent=s[pos];
  $("pCount").textContent=t("stepOf",{a:fmt(pos),b:fmt(n)});
  $("pNext").textContent= pos<n ? t("nextIs",{n:s[pos+1]}) : "✓";
  $("pBar").style.width=(100*pos/n)+"%"; $("pJump").max=n;
  try{ localStorage.setItem("nt_pos_"+seqKey(), pos); }catch(e){}
}
function speak(){
  if (!$("pVoice").checked || !window.speechSynthesis) return;
  try{ speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(String(state.seq[pos])); u.lang=VOICE[lang]; u.rate=0.95; speechSynthesis.speak(u); }catch(e){}
}
function go(d){ pos+=d; showStep(); speak(); }
function stopPlay(){ clearInterval(timer); timer=null; $("pPlay").textContent=t("play"); }
$("pPrev").addEventListener("click", function(){ go(-1); });
$("pNextB").addEventListener("click", function(){ go(1); });
$("pClose").addEventListener("click", closePlayer);
$("pPlay").addEventListener("click", function(){
  if (timer){ stopPlay(); return; }
  speak(); $("pPlay").textContent=t("pause");
  timer=setInterval(function(){ if (pos>=state.seq.length-1){ stopPlay(); return; } go(1); }, Math.max(2,+$("pSec").value||6)*1000);
});
$("pSec").addEventListener("change", function(){ if (timer){ stopPlay(); $("pPlay").click(); } });
$("pJump").addEventListener("change", function(){ pos=+$("pJump").value||1; showStep(); speak(); });
function keys(e){ if (e.key==="ArrowRight"||e.key===" "){ e.preventDefault(); go(1); } else if (e.key==="ArrowLeft"){ go(-1); } else if (e.key==="Escape"){ closePlayer(); } }

/* ---------------- hero art (original, procedural) ---------------- */
function heroArt(){
  var cv=$("heroCanvas"); if (!cv) return; var g=cv.getContext("2d"), W=900, N=180;
  g.fillStyle="#FFFDF8"; g.fillRect(0,0,W,W);
  var P=function(i){ var a=2*Math.PI*i/N-Math.PI/2; return [W/2+(W/2-30)*Math.cos(a), W/2+(W/2-30)*Math.sin(a)]; };
  g.lineWidth=0.9;
  for (var k=0;k<N;k++){ // two interwoven cardioid-like families
    var a=P(k), b=P((k*2)%N), c2=P((k*3+45)%N);
    g.strokeStyle="rgba(29,27,24,.35)"; g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.stroke();
    g.strokeStyle="rgba(155,45,32,.28)"; g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(c2[0],c2[1]); g.stroke();
  }
  g.fillStyle="#8c8170"; for (var i=0;i<N;i++){ var p=P(i); g.beginPath(); g.arc(p[0],p[1],2.2,0,Math.PI*2); g.fill(); }
}

/* ---------------- init ---------------- */
$("yr").textContent=new Date().getFullYear();
$("buyBtn").href=BUY_URL;
var start="en"; try{ start=localStorage.getItem("nt_lang")||""; }catch(e){}
if (!start){ var nl=(navigator.language||"en").slice(0,2); start=T[nl]?nl:"en"; }
applyLang(start); heroArt(); clearBoard(240);
})();
